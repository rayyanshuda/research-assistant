<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personal Research Assistant</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <style>
      :root {
        --bg: #faf9f7;
        --panel: #ffffff;
        --border: #e5e2dd;
        --text: #1f1e1d;
        --muted: #78746d;
        --accent: #b5651d;
        --bubble-user: #efece6;
        --bubble-assistant: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden; /* only #chat scrolls - nothing scrolls past the input */
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
      }
      header {
        flex: 0 0 auto;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--panel);
      }
      header h1 {
        font-size: 15px;
        margin: 0;
        font-weight: 600;
      }
      #remaining {
        font-size: 12px;
        color: var(--muted);
      }

      #layout {
        flex: 1;
        display: flex;
        min-height: 0; /* required so children can scroll instead of overflowing */
      }

      #sidebar {
        width: 260px;
        flex: 0 0 auto;
        border-right: 1px solid var(--border);
        background: var(--panel);
        overflow-y: auto;
        padding: 16px;
      }
      #sidebar h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 0 0 12px;
      }
      #uploadBtn {
        width: 100%;
        padding: 9px 12px;
        border-radius: 8px;
        border: 1px dashed var(--border);
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
        margin-bottom: 14px;
      }
      #uploadBtn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      #uploadBtn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      #docList {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #docList li.empty {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }
      .doc-item {
        padding: 8px 10px;
        border-radius: 8px;
        margin-bottom: 6px;
        background: var(--bg);
        border: 1px solid var(--border);
      }
      .doc-name {
        display: block;
        font-size: 13px;
        font-weight: 500;
        word-break: break-word;
      }
      .doc-meta {
        display: block;
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 2px;
      }
      .upload-error {
        color: #b3261e;
        font-size: 12px;
        margin-bottom: 10px;
        line-height: 1.4;
      }

      #main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        max-width: 760px;
        margin: 0 auto;
        width: 100%;
      }
      .msg {
        margin-bottom: 20px;
        display: flex;
      }
      .msg.user {
        justify-content: flex-end;
      }
      .bubble {
        max-width: 80%;
        padding: 12px 16px;
        border-radius: 12px;
        line-height: 1.55;
        font-size: 14.5px;
      }
      .msg.user .bubble {
        background: var(--bubble-user);
        border: 1px solid var(--border);
      }
      .msg.assistant .bubble {
        background: var(--bubble-assistant);
        border: 1px solid var(--border);
      }
      .bubble p:first-child {
        margin-top: 0;
      }
      .bubble p:last-child {
        margin-bottom: 0;
      }
      .bubble code {
        background: #f1efe9;
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 13px;
      }
      .bubble pre {
        background: #1f1e1d;
        color: #f5f3ee;
        padding: 12px;
        border-radius: 8px;
        overflow-x: auto;
      }
      .bubble pre code {
        background: none;
        color: inherit;
        padding: 0;
      }
      .bubble a {
        color: var(--accent);
      }
      .bubble ul,
      .bubble ol {
        padding-left: 20px;
      }

      footer {
        flex: 0 0 auto;
        border-top: 1px solid var(--border);
        padding: 16px;
        background: var(--panel);
      }
      #form {
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        gap: 8px;
      }
      #input {
        flex: 1;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        font-size: 14.5px;
        resize: none;
        font-family: inherit;
      }
      #send {
        padding: 0 20px;
        border-radius: 10px;
        border: none;
        background: var(--accent);
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      #send:disabled,
      #input:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .limit-note {
        text-align: center;
        font-size: 13px;
        color: var(--muted);
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Personal Research Assistant</h1>
      <span id="remaining"></span>
    </header>
    <div id="layout">
      <aside id="sidebar">
        <h2>Documents</h2>
        <button id="uploadBtn" type="button">+ Upload PDF</button>
        <input type="file" id="fileInput" accept="application/pdf" hidden />
        <div id="uploadError" class="upload-error"></div>
        <ul id="docList">
          <li class="empty">No PDFs uploaded yet</li>
        </ul>
      </aside>
      <div id="main">
        <div id="chat"></div>
        <footer>
          <form id="form">
            <textarea
              id="input"
              rows="1"
              placeholder="Ask a question about your uploaded PDFs..."
            ></textarea>
            <button id="send" type="submit">Send</button>
          </form>
          <div class="limit-note" id="limitNote"></div>
        </footer>
      </div>
    </div>
    <script>
      let sessionId = null;

      const chatEl = document.getElementById("chat");
      const formEl = document.getElementById("form");
      const inputEl = document.getElementById("input");
      const sendEl = document.getElementById("send");
      const remainingEl = document.getElementById("remaining");
      const limitNoteEl = document.getElementById("limitNote");
      const sidebarUploadBtn = document.getElementById("uploadBtn");
      const fileInput = document.getElementById("fileInput");
      const docListEl = document.getElementById("docList");
      const uploadErrorEl = document.getElementById("uploadError");

      function escapeHtml(s) {
        const div = document.createElement("div");
        div.textContent = s;
        return div.innerHTML;
      }

      function renderDocList(docs) {
        docListEl.innerHTML = "";
        if (!docs || docs.length === 0) {
          docListEl.innerHTML = '<li class="empty">No PDFs uploaded yet</li>';
          return;
        }
        for (const doc of docs) {
          const li = document.createElement("li");
          li.className = "doc-item";
          const pages = doc.pages
            ? `${doc.pages} page${doc.pages === 1 ? "" : "s"}`
            : "";
          li.innerHTML = `<span class="doc-name">${escapeHtml(doc.source)}</span><span class="doc-meta">${pages}</span>`;
          docListEl.appendChild(li);
        }
      }

      async function uploadFile(file) {
        uploadErrorEl.textContent = "";
        sidebarUploadBtn.disabled = true;
        sidebarUploadBtn.textContent = "Uploading...";

        const formData = new FormData();
        formData.append("file", file);
        if (sessionId) formData.append("session_id", sessionId);

        try {
          const resp = await fetch("/api/upload", {
            method: "POST",
            body: formData,
          });
          const data = await resp.json();
          if (!resp.ok)
            throw new Error(data.detail || `upload failed (${resp.status})`);
          sessionId = data.session_id;
          renderDocList(data.docs);
        } catch (err) {
          uploadErrorEl.textContent = err.message;
        } finally {
          sidebarUploadBtn.disabled = false;
          sidebarUploadBtn.textContent = "+ Upload PDF";
        }
      }

      sidebarUploadBtn.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        if (file) uploadFile(file);
        fileInput.value = "";
      });

      function renderMathIn(el) {
        renderMathInElement(el, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false },
          ],
          throwOnError: false,
        });
      }

      function addMessage(role, text) {
        const wrap = document.createElement("div");
        wrap.className = "msg " + role;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.innerHTML = marked.parse(text);
        wrap.appendChild(bubble);
        chatEl.appendChild(wrap);
        chatEl.scrollTop = chatEl.scrollHeight;
        renderMathIn(bubble);
        return bubble;
      }

      async function sendMessage(message) {
        addMessage("user", message);
        inputEl.value = "";
        inputEl.disabled = true;
        sendEl.disabled = true;

        const thinking = addMessage("assistant", "_thinking..._");

        try {
          const resp = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message, session_id: sessionId }),
          });
          if (!resp.ok) throw new Error("server error " + resp.status);
          const data = await resp.json();
          sessionId = data.session_id;
          thinking.innerHTML = marked.parse(data.answer);
          renderMathIn(thinking);

          if (
            data.questions_remaining === null ||
            data.questions_remaining === undefined
          ) {
            remainingEl.textContent = "";
          } else {
            remainingEl.textContent =
              data.questions_remaining +
              " question" +
              (data.questions_remaining === 1 ? "" : "s") +
              " left";
            if (data.questions_remaining <= 0) {
              inputEl.disabled = true;
              sendEl.disabled = true;
              limitNoteEl.textContent =
                "Demo limit reached for this visitor (tracked server-side - refreshing will not reset it).";
              return;
            }
          }
        } catch (err) {
          thinking.innerHTML =
            "<em>Something went wrong reaching the assistant. Check that the server is running.</em>";
        }

        inputEl.disabled = false;
        sendEl.disabled = false;
        inputEl.focus();
      }

      formEl.addEventListener("submit", (e) => {
        e.preventDefault();
        const message = inputEl.value.trim();
        if (!message) return;
        sendMessage(message);
      });

      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          formEl.requestSubmit();
        }
      });

      addMessage(
        "assistant",
        "Hi! Upload a PDF using the panel on the left, then ask me anything about it - I'll cite my sources by page number. This demo session is capped at a few questions, so make them count.",
      );
    </script>
  </body>
</html>
